services:
  tandoor:
    image: vabene1111/recipes:2.7.8@sha256:93dbc69a4a6843ea8637cb0e827835687a5b4b79b652074e8eb207efedc9c5a0
    container_name: tandoor
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ~/selfhosted/data/tandoor/staticfiles:/opt/recipes/staticfiles
      - ~/selfhosted/data/tandoor/mediafiles:/opt/recipes/mediafiles
    networks:
      - proxy
    depends_on:
      tandoor-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/accounts/login/"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  tandoor-db:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    container_name: tandoor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?database name required}
      POSTGRES_USER: ${POSTGRES_USER:?database user required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?database password required}
    volumes:
      - ~/selfhosted/data/tandoor/postgresql:/var/lib/postgresql/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true

services:
  tandoor:
    image: vabene1111/recipes:2.7.2@sha256:1b6d43c3c0f5d2888aa564d9daf29883212b79ad496f59f3c684c099eb1a57b9
    container_name: tandoor
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ~/selfhosted/data/tandoor/staticfiles:/opt/recipes/staticfiles
      - ~/selfhosted/data/tandoor/mediafiles:/opt/recipes/mediafiles
    networks:
      - proxy
    depends_on:
      tandoor-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/accounts/login/"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  tandoor-db:
    image: postgres:16-alpine@sha256:a2f7e20374cd8fd8ed4a588b79549e10589bea7b1686e77922f5ac741b80b8a1
    container_name: tandoor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?database name required}
      POSTGRES_USER: ${POSTGRES_USER:?database user required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?database password required}
    volumes:
      - ~/selfhosted/data/tandoor/postgresql:/var/lib/postgresql/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true

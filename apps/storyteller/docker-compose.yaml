services:
  storyteller:
    image: registry.gitlab.com/storyteller-platform/storyteller:web-v2.14.21
    container_name: storyteller
    restart: unless-stopped
    cpus: 4
    mem_limit: 4g
    env_file:
      - .env
    environment:
      - ENABLE_WEB_READER=true
    volumes:
      - ~/selfhosted/data/storyteller:/data:rw
      - ~/selfhosted/data/books/library:/library:ro
    ports:
      - 127.0.0.1:8001:8001
    networks:
      - proxy # upstreams 8001
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy:
    external: true

services:
  grocy:
    image: lscr.io/linuxserver/grocy:4.7.1@sha256:6282144f9a14d4a4dca2bc96801a2e43a2ff51116f001b13e5488eacad7b80e2
    container_name: grocy
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ~/selfhosted/data/grocy/config:/config
    networks:
      - swarmnet # upstream port 80
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--location", "--output", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  swarmnet:
    external: true
    driver: overlay

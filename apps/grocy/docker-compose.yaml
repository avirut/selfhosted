services:
  grocy:
    image: lscr.io/linuxserver/grocy:4.7.1@sha256:e4e34a0a84f407b1bcd2c3b6cd1999bf99bcad1defa8847adea7dc82a9cd6b8c
    container_name: grocy
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ~/selfhosted/data/grocy/config:/config
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--location", "--output", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true

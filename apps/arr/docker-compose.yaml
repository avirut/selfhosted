services:
  prowlarr:
    image: ghcr.io/hotio/prowlarr:release-2.6.5.5623
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/Chicago
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ~/selfhosted/data/prowlarr:/config
      - ./custom-indexers:/config/Definitions/Custom
    networks:
      - proxy # upstreams 9696

  sonarr:
    image: ghcr.io/hotio/sonarr:release-4.0.20.3014
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/Chicago
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ~/selfhosted/data/sonarr:/config
      - /mnt/data:/mnt/data
    networks:
      - proxy # upstreams 8989

  radarr:
    image: ghcr.io/hotio/radarr:release-6.4.4.10685
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/Chicago
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ~/selfhosted/data/radarr:/config
      - /mnt/data:/mnt/data
    networks:
      - proxy # upstreams 7878

  bazarr:
    image: ghcr.io/hotio/bazarr:release
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/Chicago
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ~/selfhosted/data/bazarr:/config
      - /mnt/data/media:/mnt/data/media
    networks:
      - proxy # upstreams 6767

  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:release-5.2.4
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
      - WEBUI_PORT=8080
    volumes:
      - ~/selfhosted/data/qbittorrent/appdata:/config
      - /mnt/data/torrents:/mnt/data/torrents
    network_mode: "service:gluetun" # upstreams 8080
    depends_on:
      gluetun:
        condition: service_healthy

  sabnzbd:
    image: ghcr.io/hotio/sabnzbd:release
    container_name: sabnzbd
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
      - WEBUI_PORTS=15544/tcp,15544/udp
    volumes:
      - ~/selfhosted/data/sabnzbd/config:/config
      - /mnt/data/usenet:/mnt/data/usenet
    network_mode: "service:gluetun" # upstreams 15544
    depends_on:
      gluetun:
        condition: service_healthy

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    env_file:
      - .env
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:-10.71.63.242/32}
      - SERVER_CITIES=Amsterdam
    networks:
      - proxy
    ports:
      - 127.0.0.1:8080:8080
      - 17426:17426/tcp
      - 17426:17426/udp
      - 127.0.0.1:15544:15544/tcp

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE=${LOG_FILE:-none}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
    volumes:
      - /var/lib/flaresolver:/config
    networks:
      - proxy # upstreams 8191

networks:
  proxy:
    external: true

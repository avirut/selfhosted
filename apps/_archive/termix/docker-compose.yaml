services:
  termix:
    profiles: [retired]
    image: ghcr.io/lukegus/termix:release-1.8.0
    container_name: termix
    restart: unless-stopped
    volumes:
      - ~/selfhosted/data/termix:/app/data
    environment:
      PORT: "8080"
    networks:
      - proxy # upstreams 8080

networks:
  proxy:
    external: true

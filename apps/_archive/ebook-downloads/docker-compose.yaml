services:
  ephemera:
    image: ghcr.io/orwellianepilogue/ephemera:1.3.1
    container_name: ephemera
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FLARESOLVERR_URL: http://flaresolverr:8191
      PUID: 0
      PGID: 0
    volumes:
      - ~/selfhosted/data/ephemera/data:/app/data
      - ~/selfhosted/data/ephemera/downloads:/app/downloads
      - ~/selfhosted/data/booklore/bookdrop:/app/ingest
    network_mode: "service:gluetun" # upstreams 8286
    depends_on:
      gluetun:
        condition: service_healthy

  seedboxapi:
    image: myanonamouse/seedboxapi
    container_name: seedboxapi
    restart: unless-stopped
    user: 1000:1000
    env_file:
      - .env
    environment:
      - DEBUG=1
      - mam_id=${MAM_ID}
      - interval=1
    volumes:
      - ~/selfhosted/data/seedboxapi:/config
    network_mode: "service:gluetun"

  readarr:
    image: ghcr.io/pennydreadful/bookshelf:hardcover-v0.4.20.91
    container_name: readarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/Chicago
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ~/selfhosted/data/readarr:/config
      - /mnt/data:/mnt/data
    networks:
      - swarmnet # upstreams 8787

networks:
  swarmnet:
    external: true
    driver: overlay

services:
  grocy:
    image: lscr.io/linuxserver/grocy:4.7.1@sha256:6cbf2c8b58a7ef17a20a20fef76874e9ce4ded0d1110cdef9703a0f0e27ae8ff
    container_name: grocy
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ~/selfhosted/data/grocy/config:/config
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--location", "--output", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true

name: paseo-hub

services:
  paseo-hub-db:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    container_name: paseo-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: paseo_hub
      POSTGRES_USER: paseo
      POSTGRES_PASSWORD: ${PASEO_HUB_DB_PASSWORD:?Set PASEO_HUB_DB_PASSWORD in .env}
    volumes:
      - ~/selfhosted/data/paseo-hub/postgres:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U paseo -d paseo_hub]
      interval: 5s
      timeout: 5s
      retries: 20

  paseo-hub:
    image: ghcr.io/getpaseo/hub:0.12.0@sha256:b84afa7436f1c43ea2eeba748563138f51af292a9165a814b34ea871d735cd09
    container_name: paseo-hub
    restart: unless-stopped
    depends_on:
      paseo-hub-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://paseo:${PASEO_HUB_DB_PASSWORD:?Set PASEO_HUB_DB_PASSWORD in .env}@paseo-hub-db:5432/paseo_hub
      PORT: 3000
      PASEO_HUB_APP_URL: ${PASEO_HUB_APP_URL:?Set PASEO_HUB_APP_URL in .env}
      PASEO_HUB_TRUSTED_CLIENT_IP_HEADER: x-forwarded-for
      PASEO_REGISTRATION_MODE: invite_only
      PASEO_ORGANIZATION_CREATION: disabled
    networks: [database, proxy]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  database:
    internal: true
  proxy:
    external: true

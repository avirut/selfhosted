name: paseo-hub

services:
  paseo-hub-db:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    container_name: paseo-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: paseo_hub
      POSTGRES_USER: paseo
      POSTGRES_PASSWORD: ${PASEO_HUB_DB_PASSWORD:?Set PASEO_HUB_DB_PASSWORD in .env}
    volumes:
      - ~/selfhosted/data/paseo-hub/postgres:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U paseo -d paseo_hub]
      interval: 5s
      timeout: 5s
      retries: 20

  paseo-hub:
    image: ghcr.io/getpaseo/hub:v0.11.0@sha256:e2d9370644310bc8a6ad2f0859e4910492dd99eacf57208104c34e08a4ed2c45
    container_name: paseo-hub
    restart: unless-stopped
    depends_on:
      paseo-hub-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://paseo:${PASEO_HUB_DB_PASSWORD:?Set PASEO_HUB_DB_PASSWORD in .env}@paseo-hub-db:5432/paseo_hub
      PORT: 3000
      PASEO_HUB_APP_URL: ${PASEO_HUB_APP_URL:?Set PASEO_HUB_APP_URL in .env}
      PASEO_HUB_TRUSTED_CLIENT_IP_HEADER: x-forwarded-for
      PASEO_REGISTRATION_MODE: invite_only
      PASEO_ORGANIZATION_CREATION: disabled
    networks: [database, swarmnet]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  database:
    internal: true
  swarmnet:
    external: true

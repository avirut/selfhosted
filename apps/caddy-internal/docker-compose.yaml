services:
  caddy-internal:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    container_name: caddy-internal
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ~/selfhosted/data/caddy-internal/data:/data
      - ~/selfhosted/data/caddy-internal/config:/config
    ports:
      - "80:80"
      - "8989:8989"
      - "7878:7878"
    networks:
      - proxy

networks:
  proxy:
    external: true

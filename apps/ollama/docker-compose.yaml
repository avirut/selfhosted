services:
  ollama:
    image: ollama/ollama:0.40.16@sha256:a372a1c0d1e15b68e9521189785c3ca17795c26c2356f8b1b10122cfb59ed0d7
    container_name: ollama
    restart: unless-stopped
    devices:
      - nvidia.com/gpu=all
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 5m
    ports:
      - 127.0.0.1:11434:11434
    volumes:
      - type: bind
        source: ../../data/ollama
        target: /root/.ollama
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

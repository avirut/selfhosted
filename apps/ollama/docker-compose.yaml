services:
  ollama:
    image: ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    container_name: ollama
    restart: unless-stopped
    devices:
      - nvidia.com/gpu=all
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 5m
    ports:
      - 127.0.0.1:11434:11434
    volumes:
      - type: bind
        source: ../../data/ollama
        target: /root/.ollama
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

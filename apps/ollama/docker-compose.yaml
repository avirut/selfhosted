services:
  ollama:
    image: ollama/ollama:0.40.19@sha256:7e8c7ba387b11b09dcce1eff1118b1ab433564ed263434a7730c209f2ee346f4
    container_name: ollama
    restart: unless-stopped
    devices:
      - nvidia.com/gpu=all
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 5m
    ports:
      - 127.0.0.1:11434:11434
    volumes:
      - type: bind
        source: ../../data/ollama
        target: /root/.ollama
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

services:
  pelican-panel:
    image: ghcr.io/pelican/panel:v1.0.0-rc.4@sha256:1d38b9781b072729f5f9d78440a38a0513b879e61c2d4f2a9812200dee21a539
    container_name: pelican-panel
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - BEHIND_PROXY=true
      - TRUSTED_PROXIES=172.27.0.0/16
      - SESSION_SECURE_COOKIE=true
      - MAIL_MAILER=log
    extra_hosts:
      - ${PELICAN_PANEL_HOST}:${PELICAN_EDGE_ADDRESS}
      - ${PELICAN_WINGS_HOST}:${PELICAN_EDGE_ADDRESS}
    volumes:
      - /var/lib/pelican-panel:/pelican-data
      - ~/selfhosted/data/pelican/panel-logs:/var/www/html/storage/logs
    networks:
      - pelican
      - proxy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  pelican-wings:
    image: ghcr.io/pelican/wings:v1.0.0-rc.3@sha256:046c61f8df5c1363decc89f7777cb78f9b7b5230770b19d4588ab143a85589b4
    container_name: pelican-wings
    restart: unless-stopped
    tty: true
    environment:
      - TZ=America/Chicago
      - WINGS_UID=${PELICAN_UID}
      - WINGS_GID=${PELICAN_GID}
      - WINGS_USERNAME=pelican
    extra_hosts:
      - ${PELICAN_PANEL_HOST}:${PELICAN_EDGE_ADDRESS}
      - ${PELICAN_WINGS_HOST}:${PELICAN_EDGE_ADDRESS}
    ports:
      - 127.0.0.1:8121:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers/:/var/lib/docker/containers/
      - /etc/pelican/:/etc/pelican/
      - /var/lib/pelican/:/var/lib/pelican/
      - /var/log/pelican/:/var/log/pelican/
      - /tmp/pelican/:/tmp/pelican/
      - /etc/ssl/certs:/etc/ssl/certs:ro
    networks:
      - pelican
      - proxy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  pelican:
    name: pelican
    ipam:
      config:
        - subnet: 172.29.0.0/16
  proxy:
    external: true
